    // --- CONFIGURAÇÃO DA LOGO (MANTIDA) ---
    const APP_LOGO_BASE64 = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIiBmaWxsPSIjMDAyMDYwIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iIzAwMjA2MCIgcng9IjIwIiAvPjx0ZXh0IHg9IjUwIiB5PSI3MCIgZm9udC1zaXplPSI2MCIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXdlaWdodD0iYm9sZCIgZmlsbD0id2hpdGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiPlY8L3RleHQ+PC9zdmc+";

    /* === Dexie DB setup (adicionada store 'areas') === */
    const db = new Dexie("VallooGRCDatabaseV15_6");
    db.version(1).stores({
      analyses: "++id, name, document, score, level, date",

    const uid = () => 'id' + Math.floor(Math.random() * 1e9);
    const nowISO = () => new Date().toISOString();

    async function seedIfEmpty() {
      // produtos (mantido)
      const pcount = await db.products.count();
      if (pcount === 0) {
        const defaultProducts = [
          { id: 'v_alim', name: 'Valloo Alimentação', category: 'Benefícios', risk: 'Baixo' },
          { id: 'v_ref', name: 'Valloo Refeição', category: 'Benefícios', risk: 'Baixo' },
          { id: 'v_basic', name: 'Conta Digital - Basic', category: 'Conta Digital', risk: 'Baixo' },
          { id: 'v_classic', name: 'Conta Digital - Classic', category: 'Conta Digital', risk: 'Médio' },
          { id: 'v_exclusive', name: 'Conta Digital - Exclusive', category: 'Conta Digital', risk: 'Médio' },
          { id: 'v_connect', name: 'Conta Digital - Connect', category: 'Conta Digital', risk: 'Médio' },
          { id: 'v_prem_cash', name: 'Premiação (Cash/Saque)', category: 'Campanha', risk: 'Alto' },
          { id: 'v_corp', name: 'Cartão Corporativo', category: 'Cartão Corporativo', risk: 'Médio' },
          { id: 'v_white', name: 'White Label - Conta', category: 'White Label', risk: 'Alto' }
        ];
        await db.products.bulkAdd(defaultProducts);
      }

      // crimes (mantido)
      const ccount = await db.crimes.count();
      if (ccount === 0) {
        const sample = [
          { nome: 'Lavagem de Dinheiro', tipo: 'Financeiro', risco: 'Alto' },
          { nome: 'Estelionato', tipo: 'Patrimonial', risco: 'Médio' },
          { nome: 'Tráfico de Drogas', tipo: 'Criminal', risco: 'Inadmissível' },
          { nome: 'Corrupção (Ativa/Passiva)', tipo: 'Criminal', risco: 'Alto' },
          { nome: 'Organização Criminosa', tipo: 'Criminal', risco: 'Alto' }
        ];
        await db.crimes.bulkAdd(sample);
      }

      // settings (mantido)
      const sc = await db.settings.get('default');
      if(!sc) {
        const defaultSettings = {
          id: 'default',
          puntos: {
            prod_baixo:2, prod_medio:7, prod_alto:15,
            crime_baixo:5, crime_medio:10, crime_alto:20, crime_inadmissivel:50,
            quadro_moderada:10, quadro_complexa:25, pep:20, midia:15, sancao:40, processo_criminal:20, processo_outro:5,
            area_baixo:3, area_medio:8, area_alto:18
          },
          multipliers: { pepFinance:1.15, estrangeiro:1.12, multiplosProcessos:1.08 },
          categoryScore: { low:8, medium:25, high:60 },
          thresholds: { baixo:20, medio:45, alto:75, critico:90 }
        };
        await db.settings.put(defaultSettings);
      }

      // manual (mantido)
      const m = await db.manual.get('main');
      if(!m) {
        await db.manual.put({ id: 'main', content: '# Manual Valloo\n\nUse as abas para navegar. Este manual foi gerado localmente.'});
      }

      // estrutura (mantido)
      const estruct = await db.estrutura.count();
      if(!estruct) {
        await db.estrutura.add({ id:'default', socios:[], dirigentes:[] });
      }

      // areas: seed default list so the app never starts empty (requerido)
      const acount = await db.areas.count();
      if(acount === 0) {
        const defaultAreas = [
          { name: 'Atacado', risk: 'Baixo' },
          { name: 'Consultoria', risk: 'Baixo' },
          { name: 'Hotelaria', risk: 'Baixo' },
          { name: 'Imobiliária', risk: 'Baixo' },
          { name: 'Serviços TI', risk: 'Baixo' },
          { name: 'Construtora', risk: 'Médio' },
          { name: 'Indústria', risk: 'Médio' },
          { name: 'Saúde', risk: 'Médio' },
          { name: 'Sem fins lucrativos', risk: 'Médio' },
          { name: 'Posto de Gasolina', risk: 'Alto' },
          { name: 'Joias', risk: 'Alto' },
          { name: 'Câmbio', risk: 'Alto' },
          { name: 'Obras Públicas', risk: 'Alto' },
          { name: 'Comércio Exterior', risk: 'Alto' },
          { name: 'Jogos de azar', risk: 'Inadmissível' },
          { name: 'Criptoativos', risk: 'Inadmissível' }
        ];
        await db.areas.bulkAdd(defaultAreas);
      }
    }

    function sanitizeLink(s) {
      if(!s) return null;
      try { return (new URL(s)).href; }
      catch(e) {
        try { return (new URL('http://' + s)).href; }
        catch(e2) { return String(s).trim(); }
      }
    }

    const Icon = ({ name, className="w-4 h-4" }) => {
      useEffect(()=> { if(window.lucide) window.lucide.createIcons(); }, [name]);
      return <i data-lucide={name} className={className}></i>;
    };

    // calcula score (mantido, usa form.areaCategoria para lógica)
    function calculateRiskAndBreakdown(form, productsList, crimesList, settings) {
      if (form.areaCategoria === 'Inadmissível') {
        const breakdown = { products:[], quadro:0, pep:0, media:0, sanctions:0, processos:[], totalBeforeMultipliers:100, area:0 };
        return { score: 100, level: "Risco Inadmissível", isCritical: true, breakdown };
      }

      let score = 0;
      let isCritical = false;
      const breakdown = { products:[], quadro:0, pep:0, media:0, sanctions:0, processos:[], area:0, totalBeforeMultipliers:0 };

      const pts = (settings && settings.puntos) ? settings.puntos : {
        prod_baixo:2, prod_medio:7, prod_alto:15,
        crime_baixo:5, crime_medio:10, crime_alto:20, crime_inadmissivel:50,
        quadro_moderada:10, quadro_complexa:25,
        pep:20, midia:15, sancao:40, processo_criminal:20, processo_outro:5,
        area_baixo:3, area_medio:8, area_alto:18
      };

      (form.products || []).forEach(selItem => {
        const prodDef = productsList.find(p => p.id === selItem.id);
        if(!prodDef) return;

        let contrib = 0;
        if (prodDef.risk === 'Alto') contrib = pts.prod_alto;
        else if (prodDef.risk === 'Médio') contrib = pts.prod_medio;
        else contrib = pts.prod_baixo;

        score += contrib;
        breakdown.products.push({ id: selItem.id, name: prodDef.name, category: prodDef.category, risk: prodDef.risk, load: selItem.load, periodicity: selItem.periodicity, contrib });
      });

      if (form.complexity === 'Moderada') { score += pts.quadro_moderada; breakdown.quadro = pts.quadro_moderada; }
      if (form.complexity === 'Complexa') { score += pts.quadro_complexa; breakdown.quadro = pts.quadro_complexa; }

      if (form.pepType !== 'Nao' && (form.pepPersonIds || []).length > 0) { score += pts.pep; breakdown.pep = pts.pep; }

      if (form.negativeMedia) {
        const n = (form.mediaLinks || []).length || 1;
        const add = pts.midia * n;
        score += add;
        breakdown.media = add;
      }
      if (form.hasForeignPartner && settings?.multipliers?.estrangeiro) {
        score *= settings.multipliers.estrangeiro;
      }

      if (form.sanctionsList) {
        const n = (form.sanctionLinks || []).length || 1;
        const add = pts.sancao * n;
        score += add;
        breakdown.sanctions = add;
      }

      (form.lawsuits || []).forEach(proc => {
        let procContrib = 0;
        const papel = (proc.analyzedRole || 'Passivo');

        if (papel === 'Passivo') {
          if ((proc.type || '').toLowerCase().includes('criminal')) {
            const crimeObj = crimesList.find(c => c.nome === proc.crimeNome);
            let baseValue = pts.processo_criminal;
            if(crimeObj) {
               if(crimeObj.risco === 'Inadmissível') { isCritical = true; baseValue = pts.crime_inadmissivel; }
               else if(crimeObj.risco === 'Alto') baseValue = pts.crime_alto;
               else if(crimeObj.risco === 'Médio') baseValue = pts.crime_medio;
               else baseValue = pts.crime_baixo;
            }
            if (proc.status === 'Arquivado') {
                procContrib = baseValue * 0.10; // arquivado reduz bastante (10% do base) — regra mantida
            } else {
                procContrib = baseValue;
            }
          } else {
            procContrib = pts.processo_outro;
          }
          score += procContrib;
        } else {
          procContrib = 0;
        }

        breakdown.processos.push({ ...proc, contrib: procContrib });
      });

      if (form.areaCategoria === 'Baixo') { score += pts.area_baixo; breakdown.area = pts.area_baixo; }
      else if (form.areaCategoria === 'Médio') { score += pts.area_medio; breakdown.area = pts.area_medio; }
      else if (form.areaCategoria === 'Alto') { score += pts.area_alto; breakdown.area = pts.area_alto; }

      const thresholds = (settings && settings.thresholds) ? settings.thresholds : { baixo:20, medio:45, alto:75, critico:90 };
      let level = "Baixo";
      if (isCritical || score >= thresholds.alto) level = "CRÍTICO";
      else if (score >= thresholds.medio) level = "Alto";
      else if (score >= thresholds.baixo) level = "Médio";

      breakdown.totalBeforeMultipliers = score;
      return { score: Math.min(score,100), level, isCritical, breakdown };
    }

    const Field = ({ label, type="text", value, onChange, options, placeholder }) => (
      <div className="space-y-1.5">
        <label className="text-[10px] font-black uppercase text-slate-400 block tracking-widest ml-1">{label}</label>
        { type === 'select' ? (
          <select className="w-full border-2 border-slate-100 p-4 rounded-2xl bg-white font-bold text-slate-700 outline-none focus:border-blue-500 transition-all" value={value} onChange={e=>onChange(e.target.value)}>
            { options.map(o => <option key={o.v} value={o.v}>{o.l}</option>) }
          </select>
        ) : (
          <input className="w-full border-2 border-slate-100 p-4 rounded-2xl bg-white font-bold text-slate-700 outline-none focus:border-blue-500 transition-all" value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} />
        )}
      </div>
    );

    const MediaSanctionManager = ({ title, active, onToggle, items, onUpdate }) => {
      const [url, setUrl] = useState('');
      return (
        <div className={`p-6 rounded-3xl border-2 transition-all ${active ? 'bg-white/5 border-white/20' : 'bg-transparent border-white/5 opacity-30'}`}>
          <div className="flex justify-between items-center mb-4">
            <span className="text-[10px] font-black uppercase tracking-widest">{title}</span>
            <input type="checkbox" checked={active} onChange={e=>onToggle(e.target.checked)} className="accent-blue-500 w-5 h-5 cursor-pointer"/>
          </div>
          {active && (
            <div className="space-y-3">
              <div className="flex gap-2">
                <input className="flex-1 bg-white/10 border border-white/10 rounded-xl px-4 py-2 text-xs" placeholder="Link..." value={url} onChange={e=>setUrl(e.target.value)}/>
                <button onClick={()=>{
                  if(!url) return;
                  const s = sanitizeLink(url);
                  onUpdate([...(items||[]), s]);
                  setUrl('');
                }} className="bg-blue-600 p-2 rounded-xl"><Icon name="plus" /></button>
              </div>
              <div className="space-y-1 max-h-20 overflow-y-auto custom-scroll">
                {(items||[]).map((it, idx) => (
                  <div key={idx} className="bg-white/5 p-2 rounded flex justify-between items-center text-[10px]">
                    <span className="truncate pr-4">{it}</span>
                    <button onClick={()=>onUpdate(items.filter((_,i)=>i!==idx))} className="text-red-400"><Icon name="x" className="w-3 h-3" /></button>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    };

    const LawsuitManager = ({ onAdd, items, onRemove, crimes }) => {
      const [l, setL] = useState({ description:'', subject:'', activeParty:'', passiveParty:'', status:'Em andamento', analyzedRole:'Passivo', type:'Civil', crimeNome:'', crimeRisco:'' });
      return (
        <div className="space-y-6">
          <div className="bg-white p-8 rounded-[2.5rem] border-2 border-slate-100 shadow-xl space-y-4">
            <div className="grid grid-cols-2 gap-4">
              <div className="col-span-2">
                <label className="text-[9px] font-black uppercase text-slate-400 mb-1 block">Processo nº</label>
                <input className="w-full border-2 border-slate-50 p-3 rounded-xl text-xs font-bold bg-slate-50" placeholder="0000000-00..." value={l.description} onChange={e=>setL({...l, description:e.target.value})}/>
              </div>
              <div className="col-span-2">
                <label className="text-[9px] font-black uppercase text-slate-400 mb-1 block">Assunto</label>
                <input className="w-full border-2 border-slate-50 p-3 rounded-xl text-xs font-bold bg-slate-50" placeholder="Descrição do caso..." value={l.subject} onChange={e=>setL({...l, subject:e.target.value})}/>
              </div>
              <div>
                <label className="text-[9px] font-black uppercase text-slate-400 mb-1 block">Polo Ativo</label>
                <input className="w-full border-2 border-slate-50 p-3 rounded-xl text-xs font-bold bg-slate-50" placeholder="Autor..." value={l.activeParty} onChange={e=>setL({...l, activeParty:e.target.value})}/>
              </div>
              <div>
                <label className="text-[9px] font-black uppercase text-slate-400 mb-1 block">Polo Passivo</label>
                <input className="w-full border-2 border-slate-50 p-3 rounded-xl text-xs font-bold bg-slate-50" placeholder="Réu..." value={l.passiveParty} onChange={e=>setL({...l, passiveParty:e.target.value})}/>
              </div>
            </div>
            <div className="grid grid-cols-3 gap-3">
              <div>
                <label className="text-[9px] font-black uppercase text-slate-400 mb-1 block">Tipo</label>
                <select className="w-full border-2 border-slate-50 p-3 rounded-xl text-xs font-bold bg-slate-50" value={l.type} onChange={e=>setL({...l, type:e.target.value})}>
                  <option>Civil</option><option>Criminal</option><option>Trabalhista</option><option>Administrativo</option>
                </select>
              </div>
              <div>
                <label className="text-[9px] font-black uppercase text-slate-400 mb-1 block">Status</label>
                <select className="w-full border-2 border-slate-50 p-3 rounded-xl text-xs font-bold bg-slate-50" value={l.status} onChange={e=>setL({...l, status:e.target.value})}>
                  <option>Em andamento</option>
                  <option>Condenado em 1ª instância</option>
                  <option>Condenado em 2ª Instância</option>
                  <option>Trânsito em julgado</option>
                  <option>Arquivado</option>
                </select>
              </div>
              <div>
                <label className="text-[9px] font-black uppercase text-blue-400 mb-1 block">O Analisado é:</label>
                <select className="w-full border-2 border-blue-100 p-3 rounded-xl text-xs font-black bg-blue-50 text-blue-600" value={l.analyzedRole} onChange={e=>setL({...l, analyzedRole:e.target.value})}>
                  <option value="Passivo">POLO PASSIVO</option><option value="Ativo">POLO ATIVO</option>
                </select>
              </div>
            </div>

            {l.type === 'Criminal' && (
              <select className="w-full border-2 border-red-100 p-3 rounded-xl text-xs font-bold bg-red-50 text-red-600" onChange={e=>{
                const c = crimes.find(x=>x.nome === e.target.value);
                if(c) setL({...l, crimeNome: c.nome, crimeRisco: c.risco});
              }} value={l.crimeNome}>
                <option value="">Selecione o Delito na Base...</option>
                { crimes.map(c => <option key={c.id} value={c.nome}>{c.nome} ({c.risco})</option>) }
              </select>
            )}

            <button onClick={()=>{ if(!l.description) { alert('Processo nº é obrigatório'); return; } onAdd(l); setL({ description:'', subject:'', activeParty:'', passiveParty:'', status:'Em andamento', analyzedRole:'Passivo', type:'Civil', crimeNome:'', crimeRisco:'' }); }} className="w-full bg-slate-900 text-white p-4 rounded-2xl font-black uppercase tracking-widest text-xs shadow-xl">Adicionar Processo</button>
          </div>

          <div className="space-y-3 max-h-60 overflow-y-auto custom-scroll pr-2">
            {items.map(item => (

                    <span className="text-[8px] font-black px-2 py-0.5 rounded bg-slate-100 uppercase">{item.status}</span>
                  </div>

                <div style={{display:'flex',flexDirection:'column',gap:6,alignItems:'flex-end'}}>

                </div>
              </div>
            ))}

        </div>
      );
    };

    // Administrative panel now includes Areas management
    function AdminPanel({ refreshAll }) {
      const [settings, setSettings] = useState(null);
      const [products, setProducts] = useState([]);
      const [crimes, setCrimes] = useState([]);
      const [areas, setAreas] = useState([]);
      const [prodEdit, setProdEdit] = useState({ id:'', name:'', category:'', risk:'Baixo' });
      const [crimeEdit, setCrimeEdit] = useState({ id:'', nome:'', tipo:'', risco:'Médio' });
      const [areaEdit, setAreaEdit] = useState({ id:'', name:'', risk:'Baixo' });

      useEffect(()=>{ (async ()=>{
        setSettings(await db.settings.get('default'));
        setProducts(await db.products.toArray());
        setCrimes(await db.crimes.toArray());
        setAreas(await db.areas.toArray());
      })(); }, []);

      const saveSettings = async (newSettings) => {
        await db.settings.put({ ...newSettings, id:'default' });
        setSettings(newSettings);
        alert('Configurações salvas localmente.');
        refreshAll && refreshAll();
      };

      const clearHistory = async () => {
        if(!confirm('Apagar todo o histórico local?')) return;
        await db.analyses.clear();
        alert('Histórico apagado.');
        refreshAll && refreshAll();
      };

      const saveProduct = async () => {
        if(!prodEdit.name) return alert('Nome obrigatório');
        if(prodEdit.id) {
          await db.products.put(prodEdit);
        } else {
          await db.products.add({ ...prodEdit, id: uid() });
        }
        setProducts(await db.products.toArray());
        setProdEdit({ id:'', name:'', category:'', risk:'Baixo' });
        refreshAll && refreshAll();
      };

    function App() {

        return person ? person.label : pid;

      const [mapDetailsOpen, setMapDetailsOpen] = useState(false);

      useEffect(()=>{ (async ()=>{
        await seedIfEmpty();

      })(); }, []);

      const computed = useMemo(()=> calculateRiskAndBreakdown(formData, products, crimes, settings), [formData, products, crimes, settings]);

      const toggleProduct = (id) => {
        setFormData(prev => {
          const exists = prev.products.find(x => x.id === id);
          if (exists) {
            return { ...prev, products: prev.products.filter(x => x.id !== id) };

            return { ...prev, products: [...prev.products, { id, load: 0, periodicity: 'mensal' }] };
          }
        });
      };

        setFormData(prev => ({ ...prev, products: prev.products.map(p => p.id === id ? { ...p, [field]: val } : p) }));
      };
      const addLawsuit = (l) => setFormData(prev => ({ ...prev, lawsuits: [...(prev.lawsuits||[]), { ...l, id: uid() }] }));
      const removeLawsuit = (id) => setFormData(prev => ({ ...prev, lawsuits: (prev.lawsuits||[]).filter(x=>x.id!==id) }));
      const addSocio = (socio) => setFormData(prev => ({ ...prev, estrutura: { ...(prev.estrutura||{}), socios: [...(prev.estrutura?.socios||[]), { id: uid(), ...socio }] } }));
      const removeSocio = (id) => setFormData(prev => ({ ...prev, pepPersonIds: (prev.pepPersonIds || []).filter(pid => pid !== `S-${id}`), estrutura: { ...(prev.estrutura||{}), socios: (prev.estrutura?.socios||[]).filter(s => s.id !== id) } }));

      const saveAnalysisToHistory = async () => {
        const entry = {
          name: formData.name || '-',
          document: formData.document || '-',

        };

        setHistory(await db.analyses.toArray());

      const exportHistoryCSV = async () => {
        const h = await db.analyses.toArray();
        const rows = [['Data','Nome','Documento','Score','Nível']];
        h.forEach(item => rows.push([new Date(item.date).toLocaleString(), item.name, item.document, item.score, item.level]));
        const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
        const blob = new Blob([csv], { type: 'text/csv' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'valloo_historico.csv'; a.click();
      };

      const exportAnalysisJSON = async (item) => {
        const blob = new Blob([JSON.stringify(item, null, 2)], { type: 'application/json' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `analysis_${item.id || Date.now()}.json`; a.click();

      const clearHistory = async () => {
        if(!confirm('Deseja realmente apagar todo o histórico local?')) return;

        alert('Análise removida.');

      const loadAnalysisIntoForm = (item) => {
        if(!item || !item.payload) { alert('Análise inválida'); return; }
        setFormData(item.payload.form);
        setStep(0); setActiveTab('wizard');
      };

        await saveAnalysisToHistory();

        setProducts(await db.products.toArray());

        setHistory(await db.analyses.toArray());
        setAreas(await db.areas.toArray());
      };

      // compute compact relationship alerts: only matches between current form's socios/dirigentes and historical entries
      const relationshipAlerts = useMemo(() => {
        const map = {}; // key -> { name, type, companies:Set }
        (history || []).forEach(h => {
          const histSocios = ((h.payload && h.payload.form && h.payload.form.estrutura && h.payload.form.estrutura.socios) || []).map(s => (s.name || '').trim()).filter(Boolean);
          const histDir = ((h.payload && h.payload.form && h.payload.form.estrutura && h.payload.form.estrutura.dirigentes) || []).map(d => (d.name || '').trim()).filter(Boolean);

          (formData.estrutura.socios || []).forEach(s => {
            const name = (s.name || '').trim();

              const key = `S::${name}`;
              if(!map[key]) map[key] = { name, type: 'Sócio', companies: new Set() };
              map[key].companies.add(h.name || ('#' + (h.id||'?')));
            }
          });

          (formData.estrutura.dirigentes || []).forEach(d => {

              map[key].companies.add(h.name || ('#' + (h.id||'?')));

                                <div>
                                    <label className="text-[9px] font-bold text-slate-500 uppercase">Carga Estimada (R$)</label>
                                    <input type="number" className="w-full p-2 rounded-lg border border-blue-200 text-xs font-bold" value={selectedItem.load} onChange={e=>updateProductDetails(p.id, 'load', Number(e.target.value))} />
                                </div>
                                <div>
                                    <label className="text-[9px] font-bold text-slate-500 uppercase">Periodicidade</label>
                                    <select className="w-full p-2 rounded-lg border border-blue-200 text-xs font-bold" value={selectedItem.periodicity} onChange={e=>updateProductDetails(p.id, 'periodicity', e.target.value)}>
                                        <option value="unica">Única</option>
                                        <option value="mensal">Mensal</option>
                                        <option value="semanal">Semanal</option>
                                        <option value="diaria">Diária</option>
                                    </select>
                                </div>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {step === 2 && (
                <div className="grid md:grid-cols-12 gap-10">
                  <div className="md:col-span-5 space-y-6">
                    <div className="bg-slate-900 p-8 rounded-[2.5rem] text-white">
                      <h4 className="font-black text-xs uppercase tracking-widest mb-6 border-l-4 border-blue-500 pl-4 text-blue-400">Pesquisa de Mídia & Sanções</h4>
                      <MediaSanctionManager title="Mídias Negativas" active={formData.negativeMedia} onToggle={v=>setFormData(prev=>({...prev, negativeMedia:v}))} items={formData.mediaLinks} onUpdate={it=>setFormData(prev=>({...prev, mediaLinks:it}))} />
                      <div className="h-4"></div>
                      <MediaSanctionManager title="Listas de Sanção" active={formData.sanctionsList} onToggle={v=>setFormData(prev=>({...prev, sanctionsList:v}))} items={formData.sanctionLinks} onUpdate={it=>setFormData(prev=>({...prev, sanctionLinks:it}))} />
                    </div>
                  </div>
                  <div className="md:col-span-7">
                    <h3 className="font-black text-slate-900 uppercase text-xs tracking-widest flex items-center gap-2 mb-6"><Icon name="gavel"/> Gestão Processual</h3>
                    <LawsuitManager crimes={crimes} items={formData.lawsuits} onAdd={addLawsuit} onRemove={removeLawsuit} />
                  </div>
                </div>
              )}

              {step === 3 && (
                <div className="py-20 flex flex-col items-center justify-center space-y-10 animate-in zoom-in-95">
                  <div className={`w-64 h-64 rounded-[4rem] border-[15px] flex flex-col items-center justify-center shadow-2xl transition-all ${level === 'CRÍTICO' ? 'border-red-600 bg-red-50 text-red-600' : 'border-blue-600 bg-blue-50 text-blue-600'}`}>
                    <span className="text-8xl font-black">{score}</span>
                    <span className="font-black text-xs uppercase tracking-[0.3em]">Score GRC</span>
                  </div>
                  <div className="text-center">
                    <h2 className={`text-6xl font-black uppercase italic tracking-tighter ${level === 'CRÍTICO' ? 'text-red-600' : 'text-slate-900'}`}>RISCO {level}</h2>
                    <p className="text-slate-400 font-bold uppercase tracking-widest text-sm mt-2">Dossiê validado pelos parâmetros Valloo V15.6</p>
                  </div>

                  <div className="w-full max-w-3xl bg-white border rounded-2xl p-6 space-y-4">
                    <div>
                        <label className="text-[10px] font-black uppercase text-slate-400 block tracking-widest ml-1">Parecer Final do Analista (informativo)</label>
                        <textarea rows="6" className="w-full border-2 border-slate-100 p-4 rounded-2xl bg-white mt-3" value={formData.parecerFinal || ''} onChange={e=>setFormData(prev=>({...prev, parecerFinal: e.target.value}))} placeholder="Escreva as conclusões e recomendações do analista. Este texto não influencia o score."></textarea>
                    </div>
                    <div className="grid grid-cols-2 gap-4 pt-4 border-t">
                        <Field label="Nome do Analista Responsável" value={formData.analystName} onChange={v=>setFormData(prev=>({...prev, analystName:v}))} placeholder="Quem assina a análise." />
                        <Field label="Nome do Revisor / Validação Técnica" value={formData.reviewerName} onChange={v=>setFormData(prev=>({...prev, reviewerName:v}))} placeholder="Quem revisou." />
                    </div>
                  </div>

                  <div className="flex gap-4 no-print">
                    <button onClick={handlePrint} className="bg-slate-900 text-white px-12 py-5 rounded-3xl font-black uppercase tracking-widest flex items-center gap-3 shadow-2xl hover:bg-black hover:-translate-y-1 transition-all">
                      <Icon name="printer" className="w-6 h-6"/> Emitir Relatório Oficial
                    </button>
                    <button onClick={() => { setFormData(prev=>({...prev, products:[], mediaLinks:[], sanctionLinks:[], lawsuits:[], estrutura: { socios: [], dirigentes: [] }, checkItems: [], hasForeignPartner:false, pepType:'Nao', pepRole:'', pepPersonIds: [], requestDate:'', responseDate:'', requestedBy:'', parecerFinal: '', analystName: '', reviewerName: '' })); setStep(0); }} className="bg-white border-2 border-slate-200 text-slate-500 px-12 py-5 rounded-3xl font-black uppercase tracking-widest hover:bg-slate-50 transition-all">
                      <Icon name="refresh-cw" className="w-6 h-6"/> Nova Análise
                    </button>
                    <button onClick={saveAnalysisToHistory} className="bg-blue-600 text-white px-8 py-3 rounded-2xl font-black shadow-xl">Salvar Análise</button>
                  </div>

                  <div style={{width:'100%', marginTop:24}}>
                    <div className="max-w-3xl mx-auto">
                      <div className="grid md:grid-cols-3 gap-4">
                        <div className="p-4 bg-white border rounded-2xl">
                          <div className="text-xs muted">Contribuição Produtos</div>
                          <div style={{fontWeight:700, marginTop:6}}>{breakdown.products.reduce((s,p)=>s+p.contrib,0)} pts</div>
                          <div className="muted small" style={{marginTop:6}}>{(formData.mediaLinks||[]).length} mídias • {(formData.sanctionLinks||[]).length} sanções • {(formData.lawsuits||[]).length} processos</div>
                        </div>

                        <div style={{marginTop:12}} className="bg-white border rounded-2xl p-4">
                          <div style={{fontWeight:700}}>Detalhamento</div>
                          <div style={{marginTop:8}}>
                            <table className="report-table">
                              <thead>
                                <tr><th>Item</th><th>Tipo</th><th>Observação</th><th>Contribuição (pts)</th></tr>
                              </thead>
                              <tbody>
                                {breakdown.products.map((p,idx)=>(<tr key={idx}><td>{p.name}</td><td>Produto ({p.category})</td><td>Risco: {p.risk} | Carga: {p.load}</td><td>{p.contrib}</td></tr>))}
                                <tr><td>Quadro societário</td><td>Estrutura</td><td>{formData.complexity}</td><td>{breakdown.quadro}</td></tr>
                                <tr><td>PEP</td><td>Enquadramento</td><td>{formData.pepType}{formData.pepRole ? ' — ' + formData.pepRole : ''}{pepLinkedNames.length ? ' | Vinculados: ' + pepLinkedNames.join(', ') : ''}</td><td>{breakdown.pep}</td></tr>
                                <tr><td>Mídias</td><td>Reputacional</td><td>{(formData.mediaLinks||[]).length} links</td><td>{breakdown.media}</td></tr>
                                <tr><td>Sanções</td><td>Listas</td><td>{(formData.sanctionLinks||[]).length} links</td><td>{breakdown.sanctions}</td></tr>
                                <tr><td>Área de Negócio</td><td>Categoria</td><td>{formData.areaCategoria || '-'}</td><td>{breakdown.area || 0}</td></tr>
                                {breakdown.processos.map((proc, i)=>(<tr key={i}><td>{proc.description}</td><td>{proc.type}</td><td>{proc.analyzedRole}{proc.crimeNome ? ' — ' + proc.crimeNome : ''}</td><td>{proc.contrib}</td></tr>))}
                              </tbody>
                            </table>
                          </div>
                        </div>

                        <div className="p-4 bg-white border rounded-2xl">
                          <div style={{fontWeight:700}}>Resumo</div>
                          <div style={{marginTop:8}} className="muted small">Score: {score} • Nível: {level}</div>
                        </div>
                      </div>
                    </div>
                  </div>

                </div>
              )}

            </div>

            <div className="bg-slate-50 p-8 border-t flex justify-between no-print items-center">
              <button disabled={step === 0} onClick={()=>setStep(s=>s-1)} className="px-8 py-3 border-2 border-slate-200 rounded-2xl font-black text-slate-400 disabled:opacity-30 hover:bg-white transition-all uppercase text-xs tracking-widest">Voltar</button>
              <div className="text-[10px] font-black text-slate-300">VALLOO RISK SYSTEM V15.6</div>
              {step < 3 && <button onClick={()=>setStep(s=>s+1)} className="px-12 py-4 bg-blue-600 text-white rounded-2xl font-black shadow-xl shadow-blue-200 hover:bg-blue-700 transition-all uppercase text-xs tracking-widest">Avançar</button>}
            </div>
          </div>
        </div>
      );

      const renderHistory = () => {
        // prepare compact alerts summary for UI (non-print)
        const alerts = relationshipAlerts;
        return (
          <div className="max-w-6xl mx-auto pb-20">
            <div className="bg-white rounded-[2.5rem] shadow-2xl border border-slate-200 overflow-hidden p-10">
              <div className="flex justify-between items-center mb-6">
                <div>
                  <h2 className="text-xl font-black">Histórico de Análises</h2>
                  <div className="muted">Exporte, importe ou revise análises salvas localmente.</div>
                </div>
                <div className="flex gap-3">
                  <button className="button-ghost" onClick={exportHistoryCSV}>Exportar CSV</button>
                  <button className="button-ghost" onClick={clearHistory}>Limpar histórico</button>
                </div>
              </div>

              <div className="flex gap-3 mb-4">
                <button className={`px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all ${historyView==='list'?'bg-slate-900 text-white':'text-slate-400'}`} onClick={()=>setHistoryView('list')}>Análises</button>
                <button className={`px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all ${historyView==='mapa'?'bg-slate-900 text-white':'text-slate-400'}`} onClick={()=>setHistoryView('mapa')}>Mapa de Relacionamentos</button>
              </div>

              {historyView === 'list' ? (
                <div className="space-y-3">
                  {history.length === 0 && <div className="muted">Nenhuma análise salva.</div>}
                  {history.map(h => (
                    <div key={h.id} className="p-4 bg-white border-2 border-slate-100 rounded-2xl flex justify-between items-center">
                      <div>
                        <div style={{fontWeight:800}}>{h.name} — {h.document}</div>
                        <div className="muted small">{new Date(h.date).toLocaleString()} • Score: <strong>{h.score}</strong> • {h.level}</div>
                        {h.payload && h.payload.form && h.payload.form.parecerFinal && (
                          <div className="muted small" style={{marginTop:6}}>
                            <strong>Parecer:</strong> {String(h.payload.form.parecerFinal).slice(0,120)}{String(h.payload.form.parecerFinal).length>120?'...':''}
                          </div>
                        )}
                      </div>
                      <div style={{display:'flex',gap:8}}>
                        <button className="button-ghost px-3 py-2" onClick={()=>loadAnalysisIntoForm(h)}>Carregar</button>
                        <button className="button-ghost px-3 py-2" onClick={()=>exportAnalysisJSON(h)}>Exportar JSON</button>
                        <button className="button-ghost px-3 py-2" onClick={()=>deleteAnalysis(h.id)}>Excluir</button>
                      </div>
                    </div>
                  ))}
                </div>
              ) : (
                <div>
                  {/* Compact summary alert */}
                  <div style={{marginBottom:12}}>
                    { alerts.length > 0 ? (
                      <div>
                        <div className="compact-alert">
                          <div style={{display:'flex',alignItems:'center',gap:12}}>
                            <div className="compact-pill">{alerts.length} vínculos</div>
                            <div style={{fontWeight:800}}>Existem vínculos entre os sócios/dirigentes desta análise e registros no histórico.</div>
                          </div>
                          <div>
                            <button className="button-ghost" onClick={()=>setMapDetailsOpen(v=>!v)}>{mapDetailsOpen ? 'Ocultar detalhes' : 'Ver detalhes'}</button>
                          </div>
                        </div>

                        {/* details (non-print only to avoid clutter in PDF) */}
                        { mapDetailsOpen && (
                          <div className="compact-details no-print" style={{marginTop:8}}>
                            <ul>
                              { alerts.map((a, idx) => (
                                <li key={idx}><strong>{a.type}:</strong> {a.name} — vinculado em: {a.companies.join(', ')}</li>
                              )) }
                            </ul>
                          </div>
                        ) }
                      </div>
                    ) : (
                      <div className="muted">Nenhuma relação encontrada</div>
                    )}
                  </div>

                  <table className="report-table" style={{marginTop:8}}>
                    <thead><tr><th>Empresa</th><th>Sócios</th><th>Dirigentes</th></tr></thead>
                    <tbody>
                      {history.map((h,i) => {
                        const socios = (h.payload && h.payload.form && h.payload.form.estrutura && h.payload.form.estrutura.socios || []).map(s => s.name).join(', ') || '-';
                        const dirs   = (h.payload && h.payload.form && h.payload.form.estrutura && h.payload.form.estrutura.dirigentes || []).map(d => d.name).join(', ') || '-';
                        return (<tr key={i}><td>{h.name}</td><td>{socios}</td><td>{dirs}</td></tr>);
                      })}
                    </tbody>
                  </table>
                </div>
              )}

            </div>
          </div>
        );
      };

      const renderManual = () => (
        <div className="max-w-6xl mx-auto pb-20">
          <div className="bg-white rounded-[2.5rem] shadow-2xl border border-slate-200 overflow-hidden p-10">
            <div className="flex justify-between items-start mb-6">
              <div>
                <h2 className="text-xl font-black">Manual do Usuário — Valloo GRC</h2>
                <div className="muted">Guia rápido para utilização, configuração e auditoria.</div>
              </div>
            </div>

            <div className="grid md:grid-cols-3 gap-8">
              <div className="card p-6">
                <h4 className="font-black">Como realizar uma análise</h4>
                <ol className="muted small mt-2" style={{lineHeight:1.6}}>
                  <li>Preencha identificação (PF/PJ).</li>
                  <li>Adicione estrutura societária (sócios/dirigentes).</li>
                  <li>Selecione produtos: Clique para ativar e preencha Carga/Frequência individualmente.</li>
                  <li>Registre mídias, sanções e processos (importante indicar Polo e Status).</li>
                  <li>Escreva o Parecer Final, indique os nomes dos responsáveis e gere o relatório.</li>
                </ol>
              </div>
              <div className="card p-6">
                <h4 className="font-black">Ajuste de parâmetros</h4>
                <p className="muted small">Use a aba administrativa para editar pontuações e inventário. As pontuações de Produtos e Crimes agora são geridas separadamente.</p>
              </div>
              <div className="card p-6">
                <h4 className="font-black">Exportação de relatórios</h4>
                <p className="muted small">O botão "Emitir Relatório Oficial" salva a análise e abre o diálogo de impressão com layout executivo (cabeçalho, Estrutura Societária, Dossiê de Processos, Parecer Final, breakdown e assinatura).</p>
              </div>
            </div>
          </div>
        </div>
      );

      return (
        <div className="min-h-screen">
          <PrintReport stamp={printStamp} />

          <header className="no-print bg-white border-b px-8 py-5 sticky top-0 z-50">
            <div className="max-w-7xl mx-auto flex justify-between items-center">
              <div className="flex items-center gap-3">
                {APP_LOGO_BASE64 ? (
                    <img src={APP_LOGO_BASE64} className="h-10 w-auto rounded-lg" alt="Logo" />
                ) : (
                    <div className="w-10 h-10 bg-slate-900 rounded-xl flex items-center justify-center text-white font-black italic">V</div>
                )}
                <h1 className="text-lg font-black tracking-tighter">VALLOO <span className="text-blue-600">GRC PRO</span></h1>
              </div>
              <nav className="flex gap-2">
                {['wizard','history','manual','admin'].map(t => (
                  <button key={t} onClick={()=>setActiveTab(t)} className={`px-5 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all ${activeTab === t ? 'bg-slate-900 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-100'}`}>{t}</button>
                ))}
              </nav>
            </div>
          </header>

          <main className="p-8 no-print">
            { activeTab === 'wizard' ? renderWizard()
              : activeTab === 'history' ? renderHistory()
              : activeTab === 'manual' ? renderManual()
              : activeTab === 'admin' ? <AdminPanel refreshAll={refreshAll} />
              : null }
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    seedIfEmpty();
    </script>
</body>
</html>
